controller_server:
  ros__parameters:
    use_sim_time: false                    
    controller_frequency: 20.0
    controller_plugins: ["PurePursuit"]     
    odom_topic: /odometry/filtered               
    
    # Progress و Goal Checker
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 8.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.25
      stateful: true

    # ==================== Pure Pursuit ====================
    PurePursuit:
      plugin: "yakizbot_motion::PurePursuit"
      look_ahead_distance: 0.55
      max_linear_velocity: 0.35
      max_angular_velocity: 1.2
      min_linear_velocity: 0.08
      goal_slow_distance: 0.45

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: odom 
      robot_base_frame: base_footprint      
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.22                    
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.50
        cost_scaling_factor: 3.0