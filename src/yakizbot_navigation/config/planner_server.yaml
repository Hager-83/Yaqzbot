planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["a_star"]

    a_star:
      plugin: "yakizbot_planning::AStarPlanner"
      tolerance: 0.20
      allow_unknown: true
      max_iterations: 100000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0